name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: deribit
          POSTGRES_PASSWORD: deribit
          POSTGRES_DB: deribit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deribit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: deribit
      DB_PASS: deribit
      DB_NAME: deribit
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: DB_NAME=deribit_test uv run alembic upgrade head
      - run: uv run pytest